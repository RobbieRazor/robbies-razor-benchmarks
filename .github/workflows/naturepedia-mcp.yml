name: Naturepedia MCP validation

on:
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/naturepedia-mcp.yml"
  push:
    branches:
      - main
    paths:
      - "mcp-server/**"
      - ".github/workflows/naturepedia-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Validate MCP Registry metadata
        run: npm run validate:registry

      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist-worker
